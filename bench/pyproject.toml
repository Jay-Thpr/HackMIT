[project]
name = "faultline-bench"
version = "0.1.0"
description = "Deterministic C2 benchmark runner for Faultline"
requires-python = ">=3.11"
dependencies = ["faultline-contracts", "faultline-brain"]

[tool.uv.sources]
faultline-contracts = { path = "../contracts" }
faultline-brain = { path = "../faultline/brain" }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultline_bench"]
