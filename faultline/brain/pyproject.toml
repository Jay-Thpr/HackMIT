[project]
name = "faultline-brain"
version = "0.1.0"
description = "Brain telemetry-ingestion boundary for Faultline"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "faultline-contracts"]

[tool.uv.sources]
faultline-contracts = { path = "../../contracts", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultline_brain"]
