# Faultline hero sandbox:  loadgen -> Envoy(:8080) -> orders -> Envoy(:8081) -> payments -> Postgres
#
# Host ports (127.0.0.1 only):
#   8080  gateway (Envoy front door)
#   9901  control API: operator levers, the only write path Faultline may use
#   9900  fault controller: HIDDEN, benchmark/demo only
#   8101/8102/8103  orders/payments/loadgen GET /stats (app telemetry, for diagnostics)
#
# Tunables: override any ${VAR} from the shell or a .env file next to this file.
# Compose reads `sandbox/.env` only; to reuse the root .env run `ln -sf ../.env sandbox/.env`.
#
# Clones (C6): the lab manager (services/lab, :9910) starts this same file under another project
# name (`-p faultline-clone-<slot>`) with PORT_* shifted by 1000*slot and WITHOUT faultctl.
name: faultline-sandbox

x-tunables: &tunables
  SANDBOX_TOKEN: ${SANDBOX_TOKEN:-sandbox-internal}
  LOAD_RPS: ${LOAD_RPS:-80}
  ORDERS_MAX_RETRIES: ${ORDERS_MAX_RETRIES:-3}
  ORDERS_ATTEMPT_TIMEOUT_MS: ${ORDERS_ATTEMPT_TIMEOUT_MS:-500}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-4}
  STANDBY_POOL_SIZE: ${STANDBY_POOL_SIZE:-16}
  DB_BASE_MS: ${DB_BASE_MS:-38}
  PAYMENTS_CPU_WORK_MS: ${PAYMENTS_CPU_WORK_MS:-1}
  DB_ACQUIRE_TIMEOUT_MS: ${DB_ACQUIRE_TIMEOUT_MS:-1000}
  RESET_TIMEOUT_S: ${RESET_TIMEOUT_S:-120}

# OTel auto-instrumentation (env + `opentelemetry-instrument` wrapper; no code changes).
# Only the workload paths /checkout and /pay stay instrumented; control-plane routes are excluded.
# Kill switch: OTEL_SDK_DISABLED=true. Sink: local debug output unless FAULTLINE_OTLP_ENDPOINT is set.
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp_proto_http
  OTEL_METRICS_EXPORTER: otlp_proto_http
  OTEL_LOGS_EXPORTER: none
  OTEL_PYTHON_EXCLUDED_URLS: ://[^/]+/(internal|admin|stats|healthz|rate)(/|\?|$)
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}

# One image for all Python services. Only `payments` carries the build section: five services building
# the same tag in parallel race on `docker tag` ("already exists"). The others reuse the built image.
x-app: &app
  image: faultline-sandbox-app:latest
  pull_policy: never
  restart: unless-stopped

x-db: &db
  image: postgres:16-alpine
  restart: unless-stopped
  environment:
    POSTGRES_USER: app
    POSTGRES_DB: shop
    POSTGRES_HOST_AUTH_METHOD: trust
  command: [postgres, -c, max_connections=200, -c, synchronous_commit=off]
  volumes:
    - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  healthcheck:
    test: [CMD, pg_isready, -U, app, -d, shop]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  db-primary:
    <<: *db
  db-standby:
    <<: *db

  payments:
    <<: *app
    build: {context: .., dockerfile: sandbox/Dockerfile}
    cpus: ${PAYMENTS_CPUS:-2}   # explicit limit so cpu_starve can restore it exactly
    command: [opentelemetry-instrument, uvicorn, services.payments.app:app, --host, 0.0.0.0, --port, "8000", --no-access-log, --timeout-keep-alive, "120"]
    environment:
      <<: [*tunables, *otel]
      OTEL_SERVICE_NAME: payments
      OTEL_RESOURCE_ATTRIBUTES: service.version=v1
      PRIMARY_DSN: postgresql://app@db-primary:5432/shop
      STANDBY_DSN: postgresql://app@db-standby:5432/shop
    ports: ["127.0.0.1:${PORT_PAYMENTS:-8102}:8000"]
    depends_on:
      db-primary: {condition: service_healthy}
      db-standby: {condition: service_healthy}
      otel-collector: {condition: service_started}

  orders:
    <<: *app
    command: [opentelemetry-instrument, uvicorn, services.orders.app:app, --host, 0.0.0.0, --port, "8000", --no-access-log, --timeout-keep-alive, "120"]
    environment:
      <<: [*tunables, *otel]
      OTEL_SERVICE_NAME: orders
      OTEL_RESOURCE_ATTRIBUTES: service.version=v1
      SERVICE_VERSION: v1
      PAYMENTS_URL: http://envoy:8081/pay
    ports: ["127.0.0.1:${PORT_ORDERS:-8101}:8000"]
    depends_on: [payments, otel-collector]

  # Canary build. Off by default; Owner 4 builds it from a patched checkout:
  #   ORDERS_V2_CONTEXT=/path/to/patched/repo docker compose --profile canary up -d --build orders-v2
  orders-v2:
    image: ${ORDERS_V2_IMAGE:-faultline-sandbox-orders-v2:latest}
    restart: unless-stopped
    profiles: [canary]
    build: {context: "${ORDERS_V2_CONTEXT:-..}", dockerfile: sandbox/Dockerfile}
    command: [opentelemetry-instrument, uvicorn, services.orders.app:app, --host, 0.0.0.0, --port, "8000", --no-access-log, --timeout-keep-alive, "120"]
    environment:
      <<: [*tunables, *otel]
      OTEL_SERVICE_NAME: orders
      OTEL_RESOURCE_ATTRIBUTES: service.version=v2
      SERVICE_VERSION: v2
      PAYMENTS_URL: http://envoy:8081/pay
    ports: ["127.0.0.1:${PORT_ORDERS_V2:-8104}:8000"]
    depends_on: [payments, otel-collector]

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    restart: unless-stopped
    command: [envoy, -c, /etc/envoy/envoy.yaml, --log-level, warn]
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports: ["127.0.0.1:${PORT_GATEWAY:-8080}:8080"]
    depends_on: [orders, payments]

  loadgen:
    <<: *app
    command: [opentelemetry-instrument, uvicorn, services.loadgen.app:app, --host, 0.0.0.0, --port, "8000", --no-access-log]
    environment:
      <<: [*tunables, *otel]
      OTEL_SERVICE_NAME: loadgen
      OTEL_RESOURCE_ATTRIBUTES: service.version=v1
      TARGET_URL: http://envoy:8080/checkout
    ports: ["127.0.0.1:${PORT_LOADGEN:-8103}:8000"]
    depends_on: [envoy, otel-collector]

  control:
    <<: *app
    command: [uvicorn, services.control.app:app, --host, 0.0.0.0, --port, "8000", --no-access-log]
    environment:
      <<: *tunables
      ORDERS_URLS: http://orders:8000
      ORDERS_V2_URL: http://orders-v2:8000
      PAYMENTS_URL: http://payments:8000
      ENVOY_ADMIN_URL: http://envoy:9902
    ports: ["127.0.0.1:${PORT_CONTROL:-9901}:8000"]
    depends_on: [envoy]

  faultctl:
    <<: *app
    command: [uvicorn, services.faultctl.app:app, --host, 0.0.0.0, --port, "8000", --no-access-log]
    environment:
      <<: *tunables
      PRIMARY_ADMIN_DSN: postgresql://app@db-primary:5432/shop
      STANDBY_ADMIN_DSN: postgresql://app@db-standby:5432/shop
      CONTROL_URL: http://control:8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["127.0.0.1:9900:8000"]
    depends_on: [control, loadgen]

  # OTLP receiver for the instrumented services. No host ports; the sink config is picked at
  # compose-interpolation time: sink.yaml (local debug) or sink-elastic.yaml when
  # FAULTLINE_OTLP_ENDPOINT is set.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    restart: unless-stopped
    volumes:
      - ./otel:/etc/otelcol:ro
    environment:
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-production}
      FAULTLINE_OTLP_ENDPOINT: ${FAULTLINE_OTLP_ENDPOINT:-}
      FAULTLINE_ELASTICSEARCH_API_KEY: ${FAULTLINE_ELASTICSEARCH_API_KEY:-}
    command: ["--config=/etc/otelcol/collector.yaml", "--config=/etc/otelcol/sink${FAULTLINE_OTLP_ENDPOINT:+-elastic}.yaml"]
