[project]
name = "faultline-sandbox"
version = "0.1.0"
description = "Faultline hero sandbox: services, fault controller, control API, validation scripts"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "faultline-contracts"]

[dependency-groups]
advanced = [
    "aiohttp==3.11.18",
    "aiokafka==0.12.0",
    "asyncpg==0.30.0",
    "fastapi==0.115.12",
    "redis==5.2.1",
    "uvicorn==0.34.2",
]
# service deps, for running/testing services outside Docker
services = ["fastapi==0.115.12", "uvicorn[standard]==0.34.2", "aiohttp==3.11.18", "asyncpg==0.30.0",
            "opentelemetry-distro==0.65b0", "opentelemetry-exporter-otlp-proto-http==1.44.0",
            "opentelemetry-instrumentation-fastapi==0.65b0",
            "opentelemetry-instrumentation-aiohttp-client==0.65b0",
            "opentelemetry-instrumentation-asyncpg==0.65b0"]

[tool.uv]
package = false
default-groups = ["services"]

[tool.uv.sources]
faultline-contracts = { path = "../contracts", editable = true }
