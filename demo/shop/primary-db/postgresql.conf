# primary-db: PostgreSQL 16, single primary with one streaming standby.
listen_addresses = '*'
max_connections = 400
shared_buffers = 8GB
effective_cache_size = 24GB
work_mem = 16MB

# Query time limits. Unset: a slow query holds its connection (and its lock) until the
# client gives up, which under a retry storm is never, because the client retries instead.
statement_timeout = 0
lock_timeout = 0
idle_in_transaction_session_timeout = 0

# Logging
log_min_duration_statement = 1000
log_lock_waits = off
