[project]
name = "faultline-product"
version = "0.1.0"
description = "Warp-facing Faultline incident orchestration CLI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "httpx>=0.28,<0.29",
    "faultline-brain",
    "faultline-contracts",
    "faultline-telemetry",
    "uvicorn>=0.34,<0.35",
]

[project.scripts]
faultline = "faultline_product.cli:main"

[project.optional-dependencies]
llm = [
    "openai==3.13.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultline_product"]

[tool.uv.sources]
faultline-contracts = { path = "../contracts", editable = true }
faultline-brain = { path = "../faultline/brain", editable = true }
faultline-telemetry = { path = "../faultline/telemetry", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src", "../contracts/src"]
testpaths = ["tests"]
