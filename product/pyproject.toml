[project]
name = "faultline-product"
version = "0.1.0"
description = "Warp-facing Faultline incident orchestration CLI"
requires-python = ">=3.11"
dependencies = [
    "faultline-brain",
    "faultline-contracts",
]

[project.scripts]
faultline = "faultline_product.cli:main"

[project.optional-dependencies]
llm = [
    "openai>=3.16.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultline_product"]

[tool.uv.sources]
faultline-contracts = { path = "../contracts" }
faultline-brain = { path = "../faultline/brain", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src", "../contracts/src"]
testpaths = ["tests"]
