[project]
name = "faultline-contracts"
version = "0.1.0"
description = "Shared interfaces (C1-C5) between Faultline, the sandbox, and the benchmark"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultline_contracts"]
